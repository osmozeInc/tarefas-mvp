services:
  db:
    image: postgres:16-alpine
    container_name: tarefas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tarefas_mvp
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d tarefas_mvp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mvp_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tarefas_api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: tarefas_mvp
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mvp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tarefas_pwa
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita que a pasta local sobrescreva o node_modules do container
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - mvp_network

volumes:
  pgdata:

networks:
  mvp_network:
    driver: bridge