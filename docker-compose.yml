services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tarefas_api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - mvp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tarefas_pwa
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - mvp_network

networks:
  mvp_network:
    driver: bridge